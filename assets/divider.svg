<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 8" width="800" height="8" role="img" aria-label="animated divider">
  <defs>
    <linearGradient id="shimmer" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="0.35" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#e0f2fe"/>
      <stop offset="0.65" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#0d1117"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-800 0" to="800 0" dur="2.6s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="800" height="8" rx="4" fill="#161b22"/>
  <rect width="800" height="8" rx="4" fill="url(#shimmer)"/>
</svg>
